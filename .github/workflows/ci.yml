name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Generate synthetic data (stand-in for a real raw data pull in CI)
        run: python ingestion/generate_synthetic_data.py --rows 5000 --customers 800 --out data/raw/transactions.csv

      - name: Run pipeline (Bronze -> DQ gate -> Silver -> Gold -> Train model -> Model gate)
        run: python pipelines/run_pipeline.py --format parquet --dq-threshold 0.90 --model-min-auc 0.75

      - name: Smoke-test the GenAI agent (text-to-SQL + churn explainer)
        run: |
          python genai/agents/router.py --gold-dir data/lake/gold --question "What is the churn rate?"
          python genai/agents/router.py --gold-dir data/lake/gold --question "What were the top 3 selling categories?"

      - name: Run model-layer incident simulation (Phase 4)
        run: python ml/evaluation/simulate_model_incident.py --input data/lake/gold/customer_features --min-auc 0.75

      - name: Re-verify model gate still passes after the incident sim
        run: python ml/evaluation/evaluate_model.py --model-name churn-model --min-auc 0.75

      # Real proof the Dockerfiles work, not just written-and-hoped: build
      # all three images on GitHub's runners, which have Docker preinstalled.
      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.pipeline -t urip-pipeline .
          docker build -f docker/Dockerfile.genai -t urip-genai .
          docker build -f docker/Dockerfile.monitoring -t urip-monitoring .

      # This is the step that BLOCKS deployment if data quality regresses.
      # run_pipeline.py already exits non-zero on DQ failure, which fails
      # this job and prevents any later "deploy" job (not shown here) from running.
